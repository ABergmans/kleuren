html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;padding:env(safe-area-inset-top,0px) calc(12px + env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-left,0px))}
main{max-width:640px;margin:0 auto}
h1{font-size:24px;margin:14px 0 2px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.sub{color:var(--mu);font-size:14px;margin-bottom:8px}

summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
.f{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.f input[type=text]{flex:1;min-width:120px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;min-height:44px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
.empty{text-align:center;color:var(--mu);padding:28px}
a{color:var(--ac)}
[hidden]{display:none!important}
#login{text-align:center;padding-top:14vh}
.big{font-size:72px;line-height:1}
.row{flex-wrap:wrap}
.info{display:flex;align-items:center;gap:8px;flex:1;min-width:0;min-height:48px;cursor:pointer}
.chev{color:var(--mu);font-size:14px;transition:transform .15s;flex:none}
.row.open .chev{transform:rotate(180deg)}
.grp{font-size:15px;margin:18px 2px 8px;color:var(--ac)}
.det{display:none;flex-basis:100%;padding:4px 8px 10px 0;border-top:1px dashed var(--bd);margin-top:4px}
.row.open .det{display:block}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px}
.kv span{color:var(--mu);flex:none}
.kv b{font-weight:600;text-align:right;overflow-wrap:anywhere}
.sl{display:block;font-size:13px;color:var(--mu);margin-top:8px}

.del{margin-top:6px;min-height:44px;background:none;border:1px solid var(--bd);color:var(--mu);border-radius:12px;font:inherit;padding:0 14px;cursor:pointer}

/* Ronde afbeelding linksboven + zoom */

#avatar{display:block;width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--bd);background:var(--card);cursor:zoom-in}

#zoomov.on{background:rgba(0,0,0,.92)}
#zoomov img{position:fixed;object-fit:contain;cursor:zoom-out;transition:top .3s ease,left .3s ease,width .3s ease,height .3s ease,border-radius .3s ease,opacity .3s ease}
</style>

if(!m)items.push(x);else if(x.heb)m.heb=true})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}
if(ref)setDoc(ref,{items:items,ver:docVer,merged:merged,updated:Date.now()}).catch(function(e){alert("Opslaan mislukt: "+e.code)})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function sortItems(){items.sort(function(a,b){var ca=(a.ct||"Kleurlak")==="Kleurlak"?0:1,cb=(b.ct||"Kleurlak")==="Kleurlak"?0:1;if(ca!==cb)return ca-cb;
if(ca){return(a.sub||"").localeCompare(b.sub||"")||a.naam.localeCompare(b.naam)}
var x=a.nr?+a.nr:1e9,y=b.nr?+b.nr:1e9;return x-y||a.naam.localeCompare(b.naam)})}
var F=[["alle","✨ Alles"],["heb","💖 Heb ik"],["mis","🛍️ Heb ik niet"],["nl","⛔ Niet leverbaar"],["eff","🌈 Effecten"],["kl","💅 Kleurlak"],["acc","🧰 Accessoires"]];
var EM=[["lipstick","💄"],["bordeaux","🍷"],["sangria","🍷"],["marsala","🍷"],["champagne","🥂"],["chocolate","🍫"],["cinnamon","🍂"],["spic","🍂"],["coral","🪸"],["ice ","🧊"],["tropical","🌴"],["ballerina","🩰"],["marshmallow","🍡"],["espresso","☕"],["latte","☕"],["hazelnut","🌰"],["chestnut","🌰"],["cat eye","🐱"],["holograph","🌈"],["glitter","✨"],["sparkl","✨"],["iridescent","🔮"],["mystic","🔮"],["pearl","🦪"],["rouge","❤️"],["pink","🌸"],["blush","🌸"],["rose","🌹"],["red","❤️"],["berry","🍓"],["blue","💙"],["mint","💚"],["green","💚"],["emerald","💚"],["gold","🌟"],["silver","🪩"],["white","🤍"],["black","🖤"],["onyx","🖤"],["brown","🤎"],["taupe","🤎"],["cocoa","🤎"],["mocha","🤎"],["truffle","🤎"],["camel","🤎"],["nude","🤍"],["beige","🤍"],["purple","💜"],["plum","💜"],["lilac","💜"],["mauve","💜"],["lavender","💜"],["amethyst","💜"],["orange","🧡"],["yellow","💛"],["lemon","🍋"]];
function emo(it){if(it.ct==="Accessoires")return /lamp/i.test(it.naam)?"💡":/creme|care|olie|riem|remover|cleaner/i.test(it.naam)?"🧴":"🧰";var t=(it.naam+" "+(it.eff||"")).toLowerCase()+" ";for(var i=0;i<EM.length;i++)if(t.indexOf(EM[i][0])>-1)return EM[i][1];return"💅"}
function kv(l,v){return'<div class="kv"><span>'+l+'</span><b>'+v+'</b></div>'}
function sel(i,k,l,list,cur){var o='<option value="">–</option>';
if(cur&&list.indexOf(cur)<0)list=list.concat([cur]);
list.forEach(function(x){o+='<option'+(x===cur?' selected':'')+'>'+esc(x)+'</option>'});
return'<label class="sl">'+l+'<select data-i="'+i+'" data-k="'+k+'">'+o+'</select></label>'}
function ef(k,l,v){return'<label class="sl">'+l+'<input type="text" data-e="'+k+'" value="'+esc(v||"")+'" style="margin-top:4px"></label>'}
function det(it,i){var ct=it.ct||"Kleurlak",h='<div class="det">';
if(it===editIt){h+=ef("nr","Nummer",it.nr)+ef("naam","Naam",it.naam)+ef("oms","Omschrijving",it.oms)+ef("fam","Kleurfamilie &amp; finish",it.fam)+ef("inf","Extra info",it.inf)+(it.eff?ef("eff","Effecttype",it.eff):"");
h+='<label class="sl" style="display:flex;align-items:center;gap:10px;min-height:44px"><input type="checkbox" data-e="nl"'+(it.nl?" checked":"")+' style="width:24px;height:24px;margin:0;accent-color:var(--ac)">⛔ Niet meer leverbaar</label>';
return h+'<div class="f"><button class="btn" data-sv="'+i+'">💾 Opslaan</button><button class="del" data-cn="1" style="margin-top:0">Annuleren</button></div></div>'}
h+=kv("Soort",esc(ct+(it.sub?" · "+it.sub:"")));
if(it.nr)h+=kv("Nummer",esc(it.nr));
if(it.eff)h+=kv("Effecttype",esc(it.eff));
if(it.oms)h+=kv("Omschrijving",esc(it.oms));if(it.fam)h+=kv("Kleurfamilie &amp; finish",esc(it.fam));if(it.inf)h+=kv("Extra info",esc(it.inf));if(it.nl)h+=kv("Status","⛔ Niet meer leverbaar");
if(ct==="Kleurlak")h+=sel(i,"hk","Hoofdkleur",HK,it.hk)+sel(i,"dk","Dekking",DK,it.dk)+sel(i,"fx","Afwerking",FX,it.fx);
if(it.bron)h+='<a class="lnk" href="https://pinkgellac.com'+esc(it.bron)+'" target="_blank" rel="noopener">🔗 Bekijk op Pink Gellac</a>';
return h+'<div class="f"><button class="del" data-ed="'+i+'" style="margin-top:0">✏️ Bewerken</button><button class="del" data-d="'+i+'" style="margin-top:0">🗑 Verwijderen</button></div></div>'}
function rowHtml(it,i){var sm=[it.eff,it.oms].filter(Boolean).join(" · ")||[it.hk,it.dk,it.fx].filter(Boolean).join(" · ")||it.fam||"";if(it.nl)sm="⛔ Niet meer leverbaar"+(sm?" · "+sm:"");
return'<div class="row'+(it.heb?' has':'')+(openK[kid(it)]?' open':'')+'"><div class="info" data-o="'+i+'"><div class="em">'+emo(it)+'</div><div class="nr">'+esc(it.nr||"–")+'</div><div class="nm">'+esc(it.naam)+(sm?'<small>'+esc(sm)+'</small>':'')+'</div><span class="chev">▾</span></div>'+
'<label class="t"><input type="checkbox" data-i="'+i+'" data-k="heb"'+(it.heb?" checked":"")+'>Heb ik</label>'+det(it,i)+'</div>'}
function render(){
sortItems();
var q=document.getElementById("q").value.toLowerCase().trim();
var vis=items.map(function(it,i){return[it,i]}).filter(function(p){var it=p[0];
if(filter==="heb"&&!it.heb)return false;if(filter==="mis"&&it.heb)return false;if(filter==="eff"&&!it.eff)return false;if(filter==="nl"&&!it.nl)return false;
var isK=(it.ct||"Kleurlak")==="Kleurlak";if(filter==="kl"&&!isK)return false;if(filter==="acc"&&isK)return false;
return !q||[it.nr,it.naam,it.oms,it.eff,it.sub,it.hk,it.dk,it.fx,it.fam,it.inf].join(" ").toLowerCase().indexOf(q)>-1});
document.getElementById("stat").textContent="💖 "+vis.filter(function(p){return p[0].heb}).length+" van "+vis.length+" in huis";
document.getElementById("chips").innerHTML=F.map(function(f){return'<button class="chip'+(filter===f[0]?" on":"")+'" data-f="'+f[0]+'">'+f[1]+"</button>"}).join("");
var last="",out=[];
vis.forEach(function(p){var it=p[0],k=(it.ct||"Kleurlak")==="Kleurlak"?"💅 Kleurlakken":"🧰 "+(it.sub||"Accessoires");
if(k!==last){out.push('<h2 class="grp">'+esc(k)+'</h2>');last=k}out.push(rowHtml(it,p[1]))});
document.getElementById("list").innerHTML=out.length?out.join(""):'<div class="empty">🔍 Niets gevonden.</div>';
}
document.getElementById("chips").onclick=function(e){var f=e.target.getAttribute("data-f");if(f){filter=f;render()}};
document.getElementById("q").oninput=render;
document.getElementById("list").onchange=function(e){var t=e.target,i=t.getAttribute("data-i");if(i!==null){items[i][t.getAttribute("data-k")]=t.type==="checkbox"?t.checked:t.value;save();if(t.type==="checkbox")render()}};
document.getElementById("list").onclick=function(e){
var o=e.target.closest("[data-o]");
if(o){var it=items[+o.getAttribute("data-o")],k=kid(it);openK[k]=!openK[k];o.parentNode.classList.toggle("open",!!openK[k]);return}
var ed=e.target.closest("[data-ed]");
if(ed){editIt=items[+ed.getAttribute("data-ed")];render();return}
if(e.target.closest("[data-cn]")){editIt=null;render();return}
var sv=e.target.closest("[data-sv]");
if(sv){var it=items[+sv.getAttribute("data-sv")],d=sv.closest(".det"),v={};
[].forEach.call(d.querySelectorAll("[data-e]"),function(x){v[x.getAttribute("data-e")]=x.type==="checkbox"?x.checked:x.value.trim()});
v.nr=(v.nr||"").replace(/\D/g,"");
if(!v.naam){alert("Vul een naam in.");return}
if(v.nr&&items.some(function(o){return o!==it&&o.nr===v.nr})){alert("Dit nummer staat er al in.");return}
var old=kid(it);
it.nr=v.nr;it.naam=v.naam;it.oms=v.oms;it.fam=v.fam;it.inf=v.inf;if("eff" in v)it.eff=v.eff;it.nl=!!v.nl;
var nk2=kid(it);if(nk2!==old){openK[nk2]=openK[old];delete openK[old]}
editIt=null;save();render();return}
var b=e.target.closest("[data-d]");
if(b&&confirm("Deze kleur verwijderen?")){items.splice(+b.getAttribute("data-d"),1);save();render()}};
function has(nr,naam){return items.some(function(i){return nr!==""?i.nr===nr:i.naam.toLowerCase()===naam.toLowerCase()})}
document.getElementById("add").onclick=function(){
var nr=document.getElementById("nn").value.replace(/\D/g,""),na=document.getElementById("na").value.trim(),om=document.getElementById("no").value.trim(),ef=document.getElementById("ne").value.trim(),ct=document.getElementById("nc").value;
if(!na)return;
if(has(nr,na)){alert("Deze kleur staat er al in.");return}
items.push({nr:nr,naam:na,oms:om,eff:ef,ct:ct,heb:true,cat:false});
["nn","na","no","ne"].forEach(function(id){document.getElementById(id).value=""});save();render()};
function show(id){["login","app"].forEach(function(x){document.getElementById(x).hidden=x!==id})}
if(firebaseConfig.apiKey.indexOf("JOUW")===0){
show("login");document.getElementById("signin").hidden=true;
document.getElementById("lmsg").textContent="Vul eerst je Firebase-gegevens in bovenaan het bestand (firebaseConfig)."}
else{
var fapp=initializeApp(firebaseConfig),auth=getAuth(fapp);
var db=initializeFirestore(fapp,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
document.getElementById("signin").onclick=function(){var p=new GoogleAuthProvider();signInWithPopup(auth,p).catch(function(e){
if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"){signInWithRedirect(auth,p);return}
document.getElementById("lmsg").textContent="Inloggen mislukt: "+e.code})};
document.getElementById("out").onclick=function(e){e.preventDefault();signOut(auth)};
onAuthStateChanged(auth,function(u){
if(unsub){unsub();unsub=null}
if(!u){ref=null;items=[];show("login");return}
document.getElementById("who").textContent=u.email||u.displayName||"";
ref=doc(db,"gedeeld","kleuren");uid=u.uid;show("app");
function oldRef(){return doc(db,"users",uid,"data","kleuren")}
unsub=onSnapshot(ref,{includeMetadataChanges:true},function(snap){
if(absorbing)return;
if(snap.exists()){
if(snap.metadata.hasPendingWrites)return;
var d=snap.data();items=d.items||[];docVer=d.ver||0;merged=d.merged||[];
if(snap.metadata.fromCache){render();return}
if(merged.indexOf(uid)<0){absorbing=true;
getDoc(oldRef()).then(function(o){if(o.exists())absorb(o.data().items||[])}).catch(function(){}).then(function(){
migrate(items);merged.push(uid);docVer=VER;absorbing=false;save();render()});return}
if(docVer<VER){migrate(items);docVer=VER;save()}
render()}
else{
if(snap.metadata.fromCache)return;
absorbing=true;
getDoc(oldRef()).then(function(o){items=o.exists()?(o.data().items||[]):load()}).catch(function(){items=load()}).then(function(){
migrate(items);merged=[uid];docVer=VER;absorbing=false;save();render()})}
},function(e){document.getElementById("stat").textContent="Fout met database: "+e.code})})}
</script>
<script>
(function(){
var th=document.getElementById("avatar"),ov=null,im=null,busy=false;
function full(){im.style.top="0";im.style.left="0";im.style.width="100vw";im.style.height="100vh";im.style.borderRadius="0"}
function open(){
if(ov||busy)return;busy=true;
var r=th.getBoundingClientRect();
ov=document.createElement("div");ov.id="zoomov";
im=document.createElement("img");im.src=th.src;im.alt="";
im.style.top=r.top+"px";im.style.left=r.left+"px";im.style.width=r.width+"px";im.style.height=r.height+"px";im.style.borderRadius="50%";
ov.appendChild(im);document.body.appendChild(ov);
th.style.visibility="hidden";
void ov.offsetWidth;
ov.classList.add("on");full();
setTimeout(function(){busy=false},300);
ov.onclick=close;
ov.addEventListener("touchmove",function(e){e.preventDefault()},{passive:false});
}
function close(){
if(!ov||busy)return;busy=true;
var r=th.getBoundingClientRect(),vis=r.bottom>0&&r.top<window.innerHeight;
ov.classList.remove("on");
if(vis){im.style.top=r.top+"px";im.style.left=r.left+"px";im.style.width=r.width+"px";im.style.height=r.height+"px";im.style.borderRadius="50%"}
else{im.style.opacity="0"}
setTimeout(function(){if(ov){ov.remove()}ov=im=null;th.style.visibility="";busy=false},300);
}
th.addEventListener("click",open);
th.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}});
document.addEventListener("keydown",function(e){if(e.key==="Escape")close()});
})();
</script>
