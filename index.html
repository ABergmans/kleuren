:root[data-theme="dark"]{--bg:#1b1015;--card:#271820;--tx:#f7e8ee;--mu:#b88ea0;--ac:#f0509a;--ac2:#ffb3d6;--bd:#432835}

html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;padding:env(safe-area-inset-top,0px) calc(12px + env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-left,0px))}
main{max-width:640px;margin:0 auto}
h1{font-size:24px;margin:14px 0 2px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.sub{color:var(--mu);font-size:14px;margin-bottom:8px}
input[type=text],textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;font-size:16px;-webkit-appearance:none;appearance:none}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0 2px}
.bar .sub{margin:0 0 6px;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px 0 4px;padding-bottom:4px;scrollbar-width:none}

.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:6px 6px 6px 12px;min-height:60px;margin-bottom:8px}
.row.has{box-shadow:inset 4px 0 0 var(--ac)}
.em{font-size:22px;width:28px;text-align:center;flex:none}
.nr{min-width:36px;font-weight:700;color:var(--ac);flex:none}
.nm{flex:1;min-width:0;overflow-wrap:anywhere}
.nm small{display:block;color:var(--mu);font-size:13px;line-height:1.3}
label.t{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:52px;min-height:52px;font-size:11px;color:var(--mu);gap:2px;cursor:pointer}
label.t input{width:28px;height:28px;margin:0;accent-color:var(--ac)}
.x{min-width:44px;min-height:44px;background:none;border:0;color:var(--mu);font-size:20px;cursor:pointer}
details{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:6px 14px 12px;margin:14px 0}
summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
.f{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.f input[type=text]{flex:1;min-width:120px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;min-height:44px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
.empty{text-align:center;color:var(--mu);padding:28px}
a{color:var(--ac)}
[hidden]{display:none!important}
#login{text-align:center;padding-top:14vh}
.big{font-size:72px;line-height:1}
.row{flex-wrap:wrap}
.info{display:flex;align-items:center;gap:8px;flex:1;min-width:0;min-height:48px;cursor:pointer}
.chev{color:var(--mu);font-size:14px;transition:transform .15s;flex:none}
.row.open .chev{transform:rotate(180deg)}
.grp{font-size:15px;margin:18px 2px 8px;color:var(--ac)}
.det{display:none;flex-basis:100%;padding:4px 8px 10px 0;border-top:1px dashed var(--bd);margin-top:4px}
.row.open .det{display:block}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px}
.kv span{color:var(--mu);flex:none}
.kv b{font-weight:600;text-align:right;overflow-wrap:anywhere}
.sl{display:block;font-size:13px;color:var(--mu);margin-top:8px}
.sl select,.sel{display:block;width:100%;min-height:44px;margin-top:4px;font:inherit;font-size:16px;padding:0 10px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx)}
.lnk{display:flex;align-items:center;min-height:44px}
.del{margin-top:6px;min-height:44px;background:none;border:1px solid var(--bd);color:var(--mu);border-radius:12px;font:inherit;padding:0 14px;cursor:pointer}
</style>
